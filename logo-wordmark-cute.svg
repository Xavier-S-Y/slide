    <path d="M230 220 l5 15 16-0.1-12.9 9.4 4.8 14.7-12.9-9.2-13.1 9.4 4.6-14.8-13.2-9.2 16.1-0.1z" opacity="0.85"/>
    <path d="M980 170 l6.1 18.4 19.7-0.1-15.8 11.5 5.9 18.2-15.9-11.4-16 11.6 5.6-18.4-15.9-11.3 19.8-0.1z" opacity="0.9"/>
    <path d="M900 215 l4.6 13.8 14.9-0.1-12 8.7 4.5 13.4-12.1-8.7-12.5 8.7 4.4-13.4-11.9-8.7 15-0.1z" opacity="0.8"/>
  </g>

  <g fill="#fff5be" opacity="0.95">
