    <rect x="596" y="18" width="86" height="20" rx="10" fill="#ffd9b4" opacity="0.38"/>
    <rect x="706" y="14" width="170" height="25" rx="12" fill="#ff8e82" opacity="0.34"/>
    <rect x="912" y="20" width="74" height="15" rx="8" fill="#9de7f8" opacity="0.45"/>
  </g>

  <g filter="url(#soft)">
    <rect x="160" y="172" width="860" height="108" rx="54" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="214" y="188" width="752" height="76" rx="38" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="250" y="200" width="680" height="52" rx="26" fill="#75d7ff" fill-opacity="0.18"/>
    <rect x="296" y="212" width="588" height="30" rx="15" fill="#ff8e82" fill-opacity="0.18"/>
  </g>

  <text x="590" y="252" text-anchor="middle"
        font-family="Comic Sans MS, Comic Neue, Baloo, Marker Felt, Poppins, PingFang SC, Microsoft YaHei, Arial Rounded MT Bold, sans-serif"
        font-size="88"
        font-weight="900"
        letter-spacing="4"
        fill="url(#wordGrad)"
        stroke="#ffffff"
        stroke-width="4"
        paint-order="stroke fill"
        filter="url(#ink)"
        >
    消不完的方块
  </text>

  <text x="590" y="252" text-anchor="middle"
        font-family="Comic Sans MS, Comic Neue, Baloo, Marker Felt, Poppins, PingFang SC, Microsoft YaHei, Arial Rounded MT Bold, sans-serif"
        font-size="88"
        font-weight="900"
        letter-spacing="4"
        fill="none"
        stroke="#4f2e62"
        stroke-width="2.2"
        opacity="0.55"
        paint-order="stroke">
    消不完的方块
  </text>

  <text x="590" y="252" text-anchor="middle"
        font-family="Comic Sans MS, Comic Neue, Baloo, Marker Felt, Poppins, PingFang SC, Microsoft YaHei, Arial Rounded MT Bold, sans-serif"
        font-size="88"
        font-weight="900"
        letter-spacing="4"
        fill="url(#wordGrad)"
        filter="url(#ink)"
        stroke="#ffffff"
        stroke-width="2.5"
        paint-order="stroke">
    消不完的方块
  </text>

