<?xml version="1.0" encoding="UTF-8"?>
<svg width="1180" height="420" viewBox="0 0 1180 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffdf7"/>
      <stop offset="100%" stop-color="#e6fbff"/>
    </linearGradient>
    <linearGradient id="wordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#75d7ff"/>
      <stop offset="35%" stop-color="#9de7f8"/>
      <stop offset="100%" stop-color="#ff8e82"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-25%" width="140%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#76b3bf" flood-opacity="0.25"/>
    </filter>
    <filter id="ink" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.6" result="blur"/>
      <feOffset in="blur" dx="0" dy="0" result="offsetBlur"/>
      <feMerge>
        <feMergeNode in="offsetBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1180" height="420" fill="transparent"/>
  <rect x="60" y="72" width="1060" height="276" rx="38" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.65" stroke-width="3" filter="url(#soft)"/>

  <g transform="translate(170,128)">
    <rect x="0" y="18" width="120" height="20" rx="10" fill="#75d7ff" opacity="0.35"/>
    <rect x="16" y="0" width="84" height="28" rx="14" fill="#ffd9b4" opacity="0.45"/>
    <rect x="136" y="18" width="160" height="20" rx="10" fill="#ff8e82" opacity="0.42"/>
    <rect x="322" y="12" width="90" height="28" rx="14" fill="#9de7f8" opacity="0.5"/>
